<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">楼梯与梯井复核教学示意</title>
  <desc id="desc">两段抽象梯段连接平台，提示逐层核对梯井、方向、净空和护栏；图形没有施工尺寸。</desc>
  <rect width="960" height="600" fill="#17120f"/>
  <path d="M100 90H860V510H100Z" fill="#25201b" stroke="#b99871" stroke-width="5"/>
  <path d="M260 428H680V172" fill="none" stroke="#d5c0a5" stroke-width="35" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M260 428H680V172" fill="none" stroke="#6c5746" stroke-width="3" stroke-dasharray="20 20"/>
  <rect x="606" y="352" width="148" height="150" fill="#756047" stroke="#d5c0a5" stroke-width="5"/>
  <path d="M315 428H588M680 330V205" fill="none" stroke="#f4bd79" stroke-width="11" stroke-linecap="round" stroke-dasharray="18 16"/>
  <path d="m568 407 33 21-33 21m-111-139 22-34 22 34" fill="none" stroke="#f4bd79" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f5e9d5" font-family="Arial, sans-serif" font-size="27">
    <text x="143" y="160">STAIR + OPENING</text>
    <text x="143" y="210">Check each floor separately</text>
    <text x="143" y="313">Flight / landing / direction</text>
    <text x="143" y="351">Clearance / guardrail</text>
  </g>
  <text x="143" y="554" fill="#c8b9a4" font-family="Arial, sans-serif" font-size="20">SCHEMATIC ONLY / NOT A CONSTRUCTION DRAWING</text>
</svg>
