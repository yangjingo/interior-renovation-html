  <rect x="940" y="780" width="360" height="470" class="zone dry"/><text x="1065" y="1015" class="label">主卧</text>
  <line x1="90" y1="1320" x2="1310" y2="1320" class="dim"/><text x="550" y="1360" class="note">4.8 m + 5.0 m + 4.2 m = 14.0 m</text>
