<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>yj home · v9 楼梯重建复核</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans SC", sans-serif; background: #171714; color: #eee9df; }
    body { margin: 0; padding: 32px; }
    header { max-width: 900px; margin: 0 auto 28px; }
    h1 { margin: 0 0 10px; font: 500 clamp(28px, 5vw, 56px)/1.05 Georgia, "Noto Serif SC", serif; }
    p { color: #bcb5aa; line-height: 1.7; }
    main { display: grid; gap: 34px; max-width: 1280px; margin: auto; }
    section { padding: 18px; border: 1px solid #3d3932; border-radius: 20px; background: #211f1b; }
    h2 { margin: 0 0 14px; color: #dec38f; font-size: 15px; letter-spacing: .08em; }
    .grid { display: grid; grid-template-columns: .62fr 1fr 1fr 1fr; gap: 12px; align-items: stretch; }
    figure { margin: 0; min-width: 0; }
    img { width: 100%; height: 100%; min-height: 220px; object-fit: contain; border-radius: 12px; background: #d7d4cc; }
    figcaption { margin-top: 7px; color: #8f8a80; font-size: 12px; }
    @media (max-width: 820px) { body { padding: 18px; } .grid { grid-template-columns: 1fr; } img { height: auto; min-height: 0; } }
  </style>
</head>
<body>
  <header>
    <h1>楼梯按图纸重新建立</h1>
    <p>每层分别核对：左侧是图纸证据，中间是无材质结构检查，右侧是空间透视。模型尺寸为概念假设，施工前仍需复测。</p>
  </header>
  <main>
    <section><h2>01 · 一层起步与折返</h2><div class="grid">
      <figure><img src="floor-1-plan-stair-crop.png" alt="一层图纸楼梯裁切"><figcaption>图纸证据</figcaption></figure>
      <figure><img src="floor-1-top-clay.png" alt="一层楼梯结构俯视"><figcaption>结构检查</figcaption></figure>
      <figure><img src="floor-1-stair-plan-review.png" alt="一层楼梯透视"><figcaption>材质透视</figcaption></figure>
      <figure><img src="interactive-preview-floor-1.png" alt="一层网页交互预览"><figcaption>网页逐层检查</figcaption></figure>
    </div></section>
    <section><h2>02 · 二层承接与上行</h2><div class="grid">
      <figure><img src="floor-2-plan-stair-crop.png" alt="二层图纸楼梯裁切"><figcaption>图纸证据</figcaption></figure>
      <figure><img src="floor-2-top-clay.png" alt="二层楼梯结构俯视"><figcaption>结构检查</figcaption></figure>
      <figure><img src="floor-2-stair-plan-review.png" alt="二层楼梯透视"><figcaption>材质透视</figcaption></figure>
      <figure><img src="interactive-preview-floor-2.png" alt="二层网页交互预览"><figcaption>网页逐层检查</figcaption></figure>
    </div></section>
    <section><h2>03 · 三层到达与防护</h2><div class="grid">
      <figure><img src="floor-3-plan-stair-crop.png" alt="三层图纸楼梯裁切"><figcaption>图纸证据</figcaption></figure>
      <figure><img src="floor-3-top-clay.png" alt="三层楼梯结构俯视"><figcaption>结构检查</figcaption></figure>
      <figure><img src="floor-3-stair-plan-review.png" alt="三层楼梯透视"><figcaption>材质透视</figcaption></figure>
      <figure><img src="interactive-preview-floor-3.png" alt="三层网页交互预览"><figcaption>网页逐层检查</figcaption></figure>
    </div></section>
  </main>
</body>
</html>
